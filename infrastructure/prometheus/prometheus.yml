global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'deal-discovery'
    static_configs:
      - targets: ['deal-discovery:3001']
    metrics_path: /metrics

  - job_name: 'deal-analysis'
    static_configs:
      - targets: ['deal-analysis:3002']
    metrics_path: /metrics

  - job_name: 'telegram-posting'
    static_configs:
      - targets: ['telegram-posting:3004']
    metrics_path: /metrics

  - job_name: 'curated-lists'
    static_configs:
      - targets: ['curated-lists:3006']
    metrics_path: /metrics
