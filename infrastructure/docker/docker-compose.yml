version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: ${DB_USER:-affiliate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-affiliate_platform}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-affiliate}"]
      interval: 10s
      timeout: 3s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  deal-discovery:
    build:
      context: ../..
      dockerfile: infrastructure/docker/agents/deal-discovery.Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://${DB_USER:-affiliate}:${DB_PASSWORD:-changeme}@timescaledb:5432/${DB_NAME:-affiliate_platform}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - ../../agents/deal-discovery:/app
      - ../../shared:/app/shared
    restart: unless-stopped

  telegram-posting:
    build:
      context: ../..
      dockerfile: infrastructure/docker/agents/telegram-posting.Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://${DB_USER:-affiliate}:${DB_PASSWORD:-changeme}@timescaledb:5432/${DB_NAME:-affiliate_platform}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - ../../agents/telegram-posting:/app
      - ../../shared:/app/shared
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
      dockerfile: infrastructure/docker/agents/scheduler.Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../agents/scheduler:/app
      - ../../shared:/app/shared
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

volumes:
  redis_data:
  timescaledb_data:
  chroma_data:
  prometheus_data:
  grafana_data: