services:
  # ── Data Layer ─────────────────────────────────────────
  postgres:
    image: ankane/pgvector:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-affiliate}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-affiliate_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliate"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Shared Module ──────────────────────────────────────
  shared:
    build:
      context: ./shared
      dockerfile: ../infrastructure/docker/shared.Dockerfile
    volumes:
      - ./shared:/app
      - shared_modules:/app/node_modules
    command: echo "Shared module built"

  # ── Agent Services ─────────────────────────────────────
  deal-discovery:
    build:
      context: .
      dockerfile: infrastructure/docker/agents/base.Dockerfile
      args:
        AGENT_DIR: agents/deal-discovery
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./agents/deal-discovery:/app/agents/deal-discovery
      - ./shared:/app/shared
      - shared_modules:/app/node_modules
      - playwright_cache:/root/.cache/ms-playwright
    deploy:
      resources:
        limits:
          memory: 2G

  deal-analysis:
    build:
      context: .
      dockerfile: infrastructure/docker/agents/base.Dockerfile
      args:
        AGENT_DIR: agents/deal-analysis
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./agents/deal-analysis:/app/agents/deal-analysis
      - ./shared:/app/shared
      - shared_modules:/app/node_modules
    deploy:
      resources:
        limits:
          memory: 1G

  telegram-posting:
    build:
      context: .
      dockerfile: infrastructure/docker/agents/base.Dockerfile
      args:
        AGENT_DIR: agents/telegram-posting
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - AMAZON_ASSOCIATE_TAG=${AMAZON_ASSOCIATE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./agents/telegram-posting:/app/agents/telegram-posting
      - ./shared:/app/shared
      - shared_modules:/app/node_modules

  whatsapp-ingestion:
    build:
      context: .
      dockerfile: infrastructure/docker/agents/base.Dockerfile
      args:
        AGENT_DIR: agents/whatsapp-ingestion
    restart: "no" # Manual start required for QR scan
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - WHATSAPP_GROUP_NAMES=${WHATSAPP_GROUP_NAMES}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./agents/whatsapp-ingestion:/app/agents/whatsapp-ingestion
      - ./shared:/app/shared
      - shared_modules:/app/node_modules
      - ./whatsapp-auth.json:/app/whatsapp-auth.json
    profiles: ["whatsapp"]

  # ── Monitoring ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

volumes:
  postgres_data:
  redis_data:
  shared_modules:
  playwright_cache:
  grafana_data:
  prometheus_data:
