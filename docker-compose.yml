services:
  # ── Data Layer ─────────────────────────────────────────
  postgres:
    image: ankane/pgvector:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-affiliate}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-affiliate_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-affiliate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Shared Module ──────────────────────────────────────
  shared:
    build:
      context: .
      dockerfile: infrastructure/docker/shared.Dockerfile
    volumes:
      - ./shared:/app/shared
      - shared_modules:/app/node_modules
    command: echo "Shared module built"

  # ── Agent Services ─────────────────────────────────────
  deal-discovery:
    build:
      context: .
      dockerfile: infrastructure/docker/agents/base.Dockerfile
      args:
        AGENT_DIR: agents/deal-discovery
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-affiliate_platform}
      - DB_USER=${DB_USER:-affiliate_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AMAZON_ASSOCIATE_TAG=${AMAZON_ASSOCIATE_TAG}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - TESTING_MODE=${TESTING_MODE:-false}
      - RAM_MANAGEMENT_ENABLED=${RAM_MANAGEMENT_ENABLED:-true}
      - BYPASS_RAM_MANAGEMENT_AND_USE_LOCAL_MODEL=${BYPASS_RAM_MANAGEMENT_AND_USE_LOCAL_MODEL:-true}
      - BYPASS_RAM_MANAGEMENT_AND_USE_LOCAL_MODEL=${BYPASS_RAM_MANAGEMENT_AND_USE_LOCAL_MODEL:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - playwright_cache:/root/.cache/ms-playwright
    deploy:
      resources:
        limits:
          memory: ${DOCKER_MEM_DISCOVERY:-1.5G}

  deal-analysis:
    build:
      context: .
      dockerfile: infrastructure/docker/agents/base.Dockerfile
      args:
        AGENT_DIR: agents/deal-analysis
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-affiliate_platform}
      - DB_USER=${DB_USER:-affiliate_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY}
      - REPLICATE_MODEL=${REPLICATE_MODEL:-meta/meta-llama-3-8b-instruct}
      - AMAZON_ASSOCIATE_TAG=${AMAZON_ASSOCIATE_TAG}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - TESTING_MODE=${TESTING_MODE:-false}
      - RAM_MANAGEMENT_ENABLED=${RAM_MANAGEMENT_ENABLED:-true}
      - BYPASS_RAM_MANAGEMENT_AND_USE_LOCAL_MODEL=${BYPASS_RAM_MANAGEMENT_AND_USE_LOCAL_MODEL:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${DOCKER_MEM_ANALYSIS:-250M}

  telegram-posting:
    build:
      context: .
      dockerfile: infrastructure/docker/agents/base.Dockerfile
      args:
        AGENT_DIR: agents/telegram-posting
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-affiliate_platform}
      - DB_USER=${DB_USER:-affiliate_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - AMAZON_ASSOCIATE_TAG=${AMAZON_ASSOCIATE_TAG}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GEMINI_FALLBACK_KEY=${GEMINI_FALLBACK_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY}
      - REPLICATE_MODEL=${REPLICATE_MODEL:-meta/meta-llama-3-8b-instruct}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - AI_CAPTION_ENABLED=${AI_CAPTION_ENABLED:-true}
      - REVENUE_SCORING_WEIGHT=${REVENUE_SCORING_WEIGHT:-0.12}
      - CONTENT_CALENDAR_ENABLED=${CONTENT_CALENDAR_ENABLED:-true}
      - AB_TESTING_ENABLED=${AB_TESTING_ENABLED:-true}
      - CAPTION_VARIANTS_ENABLED=${CAPTION_VARIANTS_ENABLED:-true}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - TESTING_MODE=${TESTING_MODE:-false}
      - RAM_MANAGEMENT_ENABLED=${RAM_MANAGEMENT_ENABLED:-true}
      - BYPASS_RAM_MANAGEMENT_AND_USE_LOCAL_MODEL=${BYPASS_RAM_MANAGEMENT_AND_USE_LOCAL_MODEL:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${DOCKER_MEM_TELEGRAM:-1.5G}

  curated-lists:
    build:
      context: .
      dockerfile: infrastructure/docker/agents/base.Dockerfile
      args:
        AGENT_DIR: agents/curated-lists
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-affiliate_platform}
      - DB_USER=${DB_USER:-affiliate_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_FALLBACK_KEY=${GEMINI_FALLBACK_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY}
      - REPLICATE_MODEL=${REPLICATE_MODEL:-meta/meta-llama-3-8b-instruct}
      - AMAZON_ASSOCIATE_TAG=${AMAZON_ASSOCIATE_TAG}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - TESTING_MODE=${TESTING_MODE:-false}
      - RAM_MANAGEMENT_ENABLED=${RAM_MANAGEMENT_ENABLED:-true}
      - BYPASS_RAM_MANAGEMENT_AND_USE_LOCAL_MODEL=${BYPASS_RAM_MANAGEMENT_AND_USE_LOCAL_MODEL:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - playwright_cache:/root/.cache/ms-playwright
    deploy:
      resources:
        limits:
          memory: ${DOCKER_MEM_CURATED_LISTS:-1.5G}

  whatsapp-ingestion:
    build:
      context: .
      dockerfile: infrastructure/docker/agents/base.Dockerfile
      args:
        AGENT_DIR: agents/whatsapp-ingestion
    restart: "no" # Manual start required for QR scan
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - WHATSAPP_GROUP_NAMES=${WHATSAPP_GROUP_NAMES}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./agents/whatsapp-ingestion:/app/agents/whatsapp-ingestion
      - ./shared:/app/shared
      - shared_modules:/app/node_modules
      - ./whatsapp-auth.json:/app/whatsapp-auth.json
    profiles: ["whatsapp"]

  # ── Monitoring ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

volumes:
  postgres_data:
  redis_data:
  shared_modules:
  playwright_cache:
  grafana_data:
  prometheus_data:
